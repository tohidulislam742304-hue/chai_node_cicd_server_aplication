name: Deploy Chai Code Node App on excloude VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy excloude
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{secrets.PRIVATE_KEY}}
          script: |
            cd /home/ubuntu/chai_node_cicd_server_aplication
            git pull
            npm install
            pm2 restart 0
            
            
          

