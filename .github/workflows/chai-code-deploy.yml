name: Deploy Chai Code Node App on excloude VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Docker Build and Push
        run: |
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/chaicode-node .
          docker push ${{ vars.DOCKERHUB_USERNAME }}/chaicode-node

      - name: Deploy excloude
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{secrets.PRIVATE_KEY}}
          script: |
            # kill the existing docker container
            docker rm -f chaicode-node || true
            # Again pull the fresh image from hub
            docker pull tohidul742/chaicode_node:latest
            # Run docker run -d -p 3000:3000 tohidul742/chaicode_node
            docker run -d -p 3000:3000 --name chaicode-node --restart unless-stopped tohidul742/chaicode_node
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd /home/ubuntu/chai_node_cicd_server_aplication
            git pull
            npm install
            pm2 restart 0
            
            
          

