name: Deploy Chai Code Node App on excloude VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Docker Build and Push
        run: |
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/chaicode-node .
          docker push ${{ vars.DOCKERHUB_USERNAME }}/chaicode-node

      - name: Deploy excloude
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{secrets.PRIVATE_KEY}}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd /home/ubuntu/chai_node_cicd_server_aplication
            git pull
            npm install
            pm2 restart 0
            
            
          

